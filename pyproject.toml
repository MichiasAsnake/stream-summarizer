[project]
name = "twitch-stream-summarizer"
version = "0.1.0"
description = "Live Twitch audio -> speaker-ID transcript -> structured memory -> summaries"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
asr-gpu = ["faster-whisper>=1.0"]
asr-mac = ["mlx-whisper>=0.4.0"]
asr-parakeet = ["transformers>=4.50", "accelerate", "librosa", "torch>=2.3"]
vad = ["torch>=2.3", "torchaudio>=2.3"]
speakers = ["speechbrain>=1.0", "torch>=2.3", "torchaudio>=2.3"]
llm-anthropic = ["anthropic>=0.40"]
llm-gemini = ["google-genai>=1.0"]
llm-openai = ["openai>=1.35"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
