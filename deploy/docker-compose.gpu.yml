services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports: ["8000:8000"]
    env_file:
      - .env
      - deploy/gpu.env
    volumes: ["./data:/srv/data"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
